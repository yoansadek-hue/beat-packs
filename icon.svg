<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d8b"/>
      <stop offset=".5" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#0c0b25"/>
    </linearGradient>
    <radialGradient id="label" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset=".55" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- une carte qui dépasse derrière le disque -->
  <rect x="236" y="96" width="190" height="262" rx="22" fill="#ffd23f" transform="rotate(14 331 227)" opacity=".95"/>
  <rect x="252" y="112" width="158" height="230" rx="16" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="5" transform="rotate(14 331 227)"/>
  <!-- le disque vinyle -->
  <circle cx="226" cy="290" r="178" fill="#111114"/>
  <g fill="none" stroke="#2c2c33" stroke-width="3">
    <circle cx="226" cy="290" r="164"/><circle cx="226" cy="290" r="150"/><circle cx="226" cy="290" r="136"/>
    <circle cx="226" cy="290" r="122"/><circle cx="226" cy="290" r="108"/><circle cx="226" cy="290" r="94"/>
  </g>
  <circle cx="226" cy="290" r="178" fill="url(#shine)"/>
  <circle cx="226" cy="290" r="72" fill="url(#label)"/>
  <circle cx="226" cy="290" r="72" fill="none" stroke="#e8590c" stroke-width="5"/>
  <text x="226" y="306" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46" fill="#14122e" letter-spacing="-1">BP</text>
</svg>
