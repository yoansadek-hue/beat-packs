name: Mise à jour hebdomadaire
# Chaque vendredi : streams Spotify, sorties de la semaine, dates de sortie, TOTW (tools/weekly.js)
on:
  schedule:
    - cron: "0 12 * * 5"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mise à jour des données
        run: node tools/weekly.js
      - name: Nouvelle version des fichiers (évite le cache)
        run: |
          V=$(date +%s)
          sed -i -E "s/\?v=[0-9]+/?v=$V/g" index.html
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js live.js tools/deezer_ids.json index.html
          if git diff --cached --quiet; then echo "Rien de neuf"; exit 0; fi
          git commit -m "Mise à jour hebdomadaire : streams, TOTW, sorties"
          git push
      - name: Relancer GitHub Pages
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds"
