<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3b1d8f">
<title>Beat Packs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <span class="logo">Beat Packs<small>par YoskanGame</small></span>
  <div class="chip coinchip" aria-label="Mes crédits"><span class="coin"></span><b id="wallet">0</b></div>
</header>

<main id="main">
  <section id="s-shop" class="screen">
    <h2>Boutique</h2>
    <p class="lead small">Ouvre un pack et complète ta collection d’artistes.</p>
    <div class="packs" id="packs"></div>
    <div class="stage"><div class="reveal" id="reveal"></div><p class="hint" id="hint">Choisis un pack pour l’ouvrir.</p></div>
  </section>

  <section id="s-club" class="screen" hidden>
    <h2>Ma collection</h2>
    <div class="progress" aria-hidden="true"><i id="pbar"></i></div>
    <p class="lead small" id="pct"></p>
    <div class="toolbar">
      <select id="filter" aria-label="Filtrer par rareté">
        <option value="all">Toutes les raretés</option>
        <option value="legendaire">Légendaires</option>
        <option value="epique">Épiques</option>
        <option value="rare">Rares</option>
        <option value="commun">Communes</option>
      </select>
      <button class="btn sun sm" id="sellDupes">Vendre les doublons</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="s-settings" class="screen" hidden>
    <h2>Réglages</h2>
    <div class="setgroup">
      <label class="setitem"><span>Vibrations</span><input type="checkbox" id="optVibrate" checked></label>
      <div class="setitem"><span>Recommencer à zéro</span><button class="btn coral sm" id="reset">Réinitialiser</button></div>
    </div>
    <p class="version">Beat Packs · inspiré des packs FIFA Ultimate Team</p>
  </section>
</main>

<!-- barre d'onglets en bas, reprise de Quizly -->
<nav class="tabbar" id="tabbar">
  <span class="tabpill" id="tabPill" aria-hidden="true"><i></i></span>
  <button class="tab on" data-go="s-shop"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M7 7V6a5 5 0 0 1 10 0v1h3l-1.2 13.2A2 2 0 0 1 16.8 22H7.2a2 2 0 0 1-2-1.8L4 7h3zm2 0h6V6a3 3 0 0 0-6 0v1zm-1 4a1 1 0 1 0 2 0 1 1 0 0 0-2 0zm6 0a1 1 0 1 0 2 0 1 1 0 0 0-2 0z"/></svg><span>Boutique</span></button>
  <button class="tab" data-go="s-club"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M4 6H2v14a2 2 0 0 0 2 2h14v-2H4V6zm16-4H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-6 3a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm5 10H9v-.6c0-1.7 3.3-2.6 5-2.6s5 .9 5 2.6v.6z"/></svg><span>Collection</span></button>
  <button class="tab" data-go="s-settings"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg><span>Réglages</span></button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script src="script.js"></script>
</body>
</html>
