<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#4a2496"/>
      <stop offset=".5" stop-color="#1a0f45"/>
      <stop offset="1" stop-color="#07051a"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset=".4" stop-color="#ffcf3a"/>
      <stop offset="1" stop-color="#c47f00"/>
    </linearGradient>
    <linearGradient id="plat" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#cfd3df"/>
      <stop offset="1" stop-color="#7e8398"/>
    </linearGradient>
    <linearGradient id="dia" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#f2fdff"/>
      <stop offset=".45" stop-color="#7fe6fb"/>
      <stop offset="1" stop-color="#2a7fd0"/>
    </linearGradient>
    <radialGradient id="label" cx=".38" cy=".32" r=".8">
      <stop offset="0" stop-color="#ffb3d1"/>
      <stop offset=".5" stop-color="#ff3d8b"/>
      <stop offset="1" stop-color="#ff7a1f"/>
    </radialGradient>
    <linearGradient id="vshine" x1="0" y1="0" x2="1" y2="1">
      <stop offset=".3" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".7" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- le faisceau de lumière du tunnel -->
  <polygon points="206,0 306,0 470,512 42,512" fill="url(#beam)" opacity=".35"/>
  <!-- deux cartes en éventail derrière -->
  <g filter="url(#sh)">
    <rect x="146" y="140" width="210" height="290" rx="24" fill="url(#plat)" transform="rotate(-17 251 400)"/>
    <rect x="156" y="140" width="210" height="290" rx="24" fill="url(#dia)" transform="rotate(17 261 400)"/>
  </g>
  <!-- la carte Or devant, avec un vinyle à la place de la pochette -->
  <g filter="url(#sh)">
    <rect x="141" y="106" width="230" height="318" rx="26" fill="url(#gold)"/>
    <rect x="153" y="118" width="206" height="294" rx="18" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="4"/>
    <circle cx="256" cy="236" r="84" fill="#111114"/>
    <g fill="none" stroke="#2e2e36" stroke-width="2.5">
      <circle cx="256" cy="236" r="74"/><circle cx="256" cy="236" r="64"/><circle cx="256" cy="236" r="54"/><circle cx="256" cy="236" r="44"/>
    </g>
    <circle cx="256" cy="236" r="84" fill="url(#vshine)"/>
    <circle cx="256" cy="236" r="30" fill="url(#label)"/>
    <circle cx="256" cy="236" r="5" fill="#111114"/>
    <text x="256" y="382" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="66" fill="#2a1a00" letter-spacing="-2">BP</text>
  </g>
  <!-- éclats -->
  <g fill="#fff">
    <path d="M404 112 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7z" opacity=".95"/>
    <path d="M100 168 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4z" opacity=".75"/>
    <path d="M420 300 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z" opacity=".6"/>
  </g>
</svg>
